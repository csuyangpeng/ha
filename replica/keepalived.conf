global_defs {
    router_id 1b01
}

vrrp_script chk_mysql_ha {
    script "/home/sder/ha/replica/scripts/check_mysql_status.sh"
    interval 60                     # 每5秒检查一次
    timeout 4000                      # 3秒超时
    #weight -20                     # 检查失败时优先级-20
    #fall 2                         # 连续2次失败才认为失败
    #rise 1                         # 成功1次就恢复
    user root                      # 使用root用户执行
}

vrrp_instance VI_1 {
    state BACKUP 
    interface ens3 # 请根据实际情况修改网卡
    virtual_router_id 251
    priority 100
    advert_int 1
    nopreempt
    unicast_src_ip 10.18.1.27   # 本机IP
    unicast_peer {
        10.18.1.28             # 对端IP
    }
    authentication {
        auth_type PASS
        auth_pass 1111
    }
    virtual_ipaddress {
        10.18.1.30
    }
    track_script {
        chk_mysql_ha
    }
    notify_master "/home/sder/ha/replica/scripts/notify_master.sh" 
    notify_backup "/home/sder/ha/replica/scripts/notify_slave.sh"
}
