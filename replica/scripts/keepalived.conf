# Keepalived 配置 - replica 主备（10.18.1.27）
# 部署路径：/etc/keepalived/keepalived.conf
# 节点差异：priority / unicast_src_ip / unicast_peer（10.18.1.28 见 keepalived.28.conf）
#
# 关键点：
#   1. 两端都用 state BACKUP + nopreempt：启动时优先级高者成为 MASTER，
#      主节点恢复后不抢回 VIP，避免来回漂移。
#   2. 使用 unicast_src_ip / unicast_peer，不依赖组播。
#   3. track_script 不配 weight：脚本失败时实例进入 FAULT 并释放 VIP，
#      备节点才能接管。
#   4. keepalived 2.2+ 执行脚本需 enable_script_security，且脚本必须属主 root、
#      组/其他人不可写（chown root:root + chmod 755）。

global_defs {
    enable_script_security
    script_user root
}

vrrp_script chk_mysql_ha {
    script "/etc/keepalived/replica-runner.sh check"
    interval 5
    timeout 10
    fall 3
    rise 2
    user root
}

vrrp_instance VI_MYSQL_HA {
    state BACKUP
    interface ens3
    virtual_router_id 251
    priority 150
    advert_int 1
    nopreempt

    unicast_src_ip 10.18.1.27
    unicast_peer {
        10.18.1.28
    }

    authentication {
        auth_type PASS
        auth_pass Rp251ha
    }

    virtual_ipaddress {
        10.18.1.30/24 dev ens3
    }

    track_script {
        chk_mysql_ha
    }

    notify_master "/etc/keepalived/replica-runner.sh master"
    notify_backup "/etc/keepalived/replica-runner.sh backup"
    notify_fault  "/etc/keepalived/replica-runner.sh backup"
    notify_stop   "/etc/keepalived/replica-runner.sh backup"
}
