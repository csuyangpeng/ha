# Keepalived 配置 - replica 主备（10.18.1.28）
# 部署路径：/etc/keepalived/keepalived.conf
# 与 10.18.1.27 的唯一区别：priority 100、unicast_src_ip / unicast_peer 对调。

global_defs {
    enable_script_security
    script_user root
}

vrrp_script chk_mysql_ha {
    script "/etc/keepalived/replica-runner.sh check"
    interval 5
    timeout 10
    fall 3
    rise 2
    user root
}

vrrp_instance VI_MYSQL_HA {
    state BACKUP
    interface ens3
    virtual_router_id 251
    priority 100
    advert_int 1
    nopreempt

    unicast_src_ip 10.18.1.28
    unicast_peer {
        # @@PEER_BEGIN@@
        10.18.1.27
        # @@PEER_END@@
    }

    authentication {
        auth_type PASS
        auth_pass Rp251ha
    }

    virtual_ipaddress {
        # @@VIP_BEGIN@@
        10.18.1.30/24 dev ens3
        # @@VIP_END@@
    }

    track_script {
        chk_mysql_ha
    }

    notify_master "/etc/keepalived/replica-runner.sh master"
    notify_backup "/etc/keepalived/replica-runner.sh backup"
    notify_fault  "/etc/keepalived/replica-runner.sh backup"
    notify_stop   "/etc/keepalived/replica-runner.sh backup"
}
